<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn website</title>
  <style>
  .galerij {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

    height: 200px;
    object-fit: cover;
  }

</head>
