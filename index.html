
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Card Collection</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">MY PERSONAL COLLECTION</p>
            <h1>Pokémon Cards</h1>
            <p class="subtitle">
                A collection of my favourite Pokémon cards.
            </p>
        </header>

  
<section class="gallery-section">

    <div class="gallery-heading">
        <h2>My collection</h2>
        <p id="gallery-count">Loading Pokémon...</p>
    </div>

    <div
        class="gallery"
        id="pokemon-gallery"
        aria-label="Pokémon card collection"
    >
    </div>

    <p
        id="gallery-status"
        class="gallery-status"
        role="status"
        aria-live="polite"
    ></p>

</section>


        <footer class="footer">
            <p>Made with passion for Pokémon.</p>
        </footer>

    </main>

</body>
</html>
