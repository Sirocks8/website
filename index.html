
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Card Collection</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <main class="container">

        <header class="header">
            <p class="eyebrow">MY PERSONAL COLLECTION</p>
            <h1>Pokémon Cards</h1>
            <p class="subtitle">
                A collection of my favourite Pokémon cards.
            </p>
        </header>

        <section class="gallery" aria-label="Pokémon card collection">

            <div class="item">
                <button class="kaart" type="button"
                    aria-label="Flip Salamence card"
                    aria-pressed="false">
                    <span class="kaart-binnen">
                        <img class="front"
                            src="photos-pokemon/salamence-front.jpeg"
                            alt="Salamence card front">
                        <img class="back"
                            src="photos-pokemon/salamence-back.jpeg"
                            alt="Salamence card back">
                    </span>
                </button>
                <h2 class="naam">Salamence</h2>
            </div>

            <div class="item">
                <button class="kaart" type="button"
                    aria-label="Flip Claydol card"
                    aria-pressed="false">
                    <span class="kaart-binnen">
                        <img class="front"
                            src="photos-pokemon/claydol-front.jpeg"
                            alt="Claydol card front">
                        <img class="back"
                            src="photos-pokemon/claydol-back.jpeg"
                            alt="Claydol card back">
                    </span>
                </button>
                <h2 class="naam">Claydol</h2>
            </div>

            <div class="item">
                <button class="kaart" type="button"
                    aria-label="Flip Flygon card"
                    aria-pressed="false">
                    <span class="kaart-binnen">
                        <img class="front"
                            src="photos-pokemon/flygon-front.jpeg"
                            alt="Flygon card front">
                        <img class="back"
                            src="photos-pokemon/flygon-back.jpeg"
                            alt="Flygon card back">
                    </span>
                </button>
                <h2 class="naam">Flygon</h2>
            </div>

            <div class="item">
                <button class="kaart" type="button"
                    aria-label="Flip Vaporeon card"
                    aria-pressed="false">
                    <span class="kaart-binnen">
                        <img class="front"
                            src="photos-pokemon/vaporeon-front.jpeg"
                            alt="Vaporeon card front">
                        <img class="back"
                            src="photos-pokemon/vaporeon-back.jpeg"
                            alt="Vaporeon card back">
                    </span>
                </button>
                <h2 class="naam">Vaporeon</h2>
            </div>

        </section>

        <footer class="footer">
            <p>Made with passion for Pokémon.</p>
        </footer>

    </main>

</body>
</html>
